<!-- component: footer — sitewide footer. Facts come from claims.json / site.json only.
     Legal links land in M3 (pages don't exist yet — no dead links before then). -->
<footer class="site-footer">
  <div class="container site-footer__inner">
    <div class="site-footer__brand">
      <p class="site-footer__name">{{ site.legal_name }}</p>
      <p class="site-footer__tagline">{{ claims.phrasings.verifiable }}</p>
    </div>
    <div class="site-footer__contact">
      <p>{{ site.hq_short }}</p>
      <p><a href="mailto:{{ site.email }}">{{ site.email }}</a></p>
    </div>
  </div>
  <div class="container site-footer__legal">
    <p>© {{ build.year }} {{ site.legal_name }}. All rights reserved.</p>
  </div>
</footer>
