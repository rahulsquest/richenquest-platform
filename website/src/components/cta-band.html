<!-- component: cta-band — sitewide conversion band.
     v1: email CTA. M1 swaps the button to the Zoho Bookings "Free Counseling — 30 min"
     link the moment the Zoho org is live (single edit here changes every page — that's the point). -->
<section class="cta-band">
  <div class="container cta-band__inner">
    <h2 class="cta-band__title">Talk to a counselor about studying abroad</h2>
    <p class="cta-band__text">{{ claims.phrasings.supported }}</p>
    <a class="btn btn--inverse" href="mailto:{{ site.email }}">Email {{ site.email }}</a>
  </div>
</section>
