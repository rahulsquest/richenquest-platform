<!-- component: header — sitewide masthead + primary navigation.
     Nav items live HERE (single source; v1 engine has no loops — ADR-002).
     Until M2/M3 pages ship, items deep-link to homepage sections (/#id works
     from every page). CTA is a REAL workflow (WhatsApp — founder decision 8).
     JS hooks: data-nav-toggle (modules/nav.js), data-disclosure (modules/disclosure.js). -->
<header class="site-header">
  <div class="container site-header__inner">
<!-- @include components/brand-logo.html -->
    <button class="site-header__toggle" type="button" aria-expanded="false" aria-controls="site-nav" data-nav-toggle>
      <span class="visually-hidden">Menu</span>
      <svg class="icon site-header__icon-open" aria-hidden="true"><use href="/assets/img/icons.svg#icon-menu"></use></svg>
      <svg class="icon site-header__icon-close" aria-hidden="true"><use href="/assets/img/icons.svg#icon-close"></use></svg>
    </button>
    <nav id="site-nav" class="site-nav" aria-label="Main">
      <ul class="site-nav__list">
        <li class="site-nav__item">
          <button class="site-nav__group-toggle" type="button" aria-expanded="false"
                  aria-controls="nav-destinations" data-disclosure="nav-destinations">
            Destinations
            <svg class="icon icon--sm" aria-hidden="true"><use href="/assets/img/icons.svg#icon-chevron-down"></use></svg>
          </button>
          <div class="site-nav__dropdown" id="nav-destinations" hidden>
            <a class="site-nav__dropdown-link" href="/destinations/">All destinations</a>
            <a class="site-nav__dropdown-link" href="/destinations/italy/">Italy</a>
            <a class="site-nav__dropdown-link" href="/destinations/germany/">Germany</a>
            <a class="site-nav__dropdown-link" href="/destinations/france/">France</a>
            <a class="site-nav__dropdown-link" href="/destinations/ireland/">Ireland</a>
            <a class="site-nav__dropdown-link" href="/destinations/netherlands/">Netherlands</a>
            <a class="site-nav__dropdown-link" href="/destinations/hungary/">Hungary</a>
            <a class="site-nav__dropdown-link" href="/destinations/japan/">Japan</a>
            <a class="site-nav__dropdown-link" href="/nepal/">From Nepal</a>
          </div>
        </li>
        <li class="site-nav__item">
          <a class="site-nav__link site-nav__link--tool" href="/match/">
            <svg class="icon icon--sm" aria-hidden="true"><use href="/assets/img/icons.svg#icon-compass"></use></svg>
            Find your fit
          </a>
        </li>
        <li class="site-nav__item"><a class="site-nav__link" href="/services/">Services</a></li>
        <li class="site-nav__item"><a class="site-nav__link" href="/about/">About</a></li>
        <li class="site-nav__item"><a class="site-nav__link" href="/success-stories/">Stories</a></li>
        <li class="site-nav__item"><a class="site-nav__link" href="/contact/">Contact</a></li>
        <li class="site-nav__item">
          <a class="btn btn--primary site-nav__cta" href="{{ site.whatsapp_href }}">Free consultation</a>
        </li>
      </ul>
    </nav>
  </div>
</header>
