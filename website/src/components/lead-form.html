<!-- component: lead-form — Zoho CRM Web-to-Lead form.
     ADR-003 compliant: the browser POSTs DIRECTLY to Zoho. No backend, no
     submission handler, no website database. Zoho owns validation, dedupe,
     assignment (Student_Lead_Routing) and every downstream workflow.

     NOT YET WIRED INTO ANY PAGE. It activates only when the three
     site.zoho_webform_* values are real. Rendering it before then would ship a
     form that silently discards submissions — precisely the defect File 12
     records on the legacy site ("preventDefault → fake success message").

     The stock field names below (Last Name, First Name, Email, Phone,
     Description, LEADCF*) are Zoho's Web-to-Lead contract. The LEADCF indices
     for our custom fields are assigned by Zoho when the webform is generated in
     the console, so they arrive with the keys — see docs/15. -->
<form class="form" method="POST" accept-charset="UTF-8"
      action="{{ site.zoho_webform_action }}" data-lead-form>
  <!-- Zoho routing identifiers — generated per webform, not secrets. -->
  <input type="hidden" name="xnQsjsdp" value="{{ site.zoho_webform_key }}">
  <input type="hidden" name="xmIwtLD" value="{{ site.zoho_webform_digest }}">
  <input type="hidden" name="actionType" value="TGVhZHM=">
  <input type="hidden" name="returnURL" value="{{ site.zoho_webform_return_url }}">

  <!-- Source attribution. Populated per page; UTM values filled by main.js from
       the query string into the UTM_Source/Medium/Campaign fields that already
       exist in CRM. -->
  <input type="hidden" name="Lead Source" value="Web Form">
  <input type="hidden" name="LEADCF_SOURCE_DETAIL" value="{{ page.lead_source_detail }}" data-lead-source-detail>
  <input type="hidden" name="LEADCF_UTM_SOURCE" value="" data-utm="utm_source">
  <input type="hidden" name="LEADCF_UTM_MEDIUM" value="" data-utm="utm_medium">
  <input type="hidden" name="LEADCF_UTM_CAMPAIGN" value="" data-utm="utm_campaign">

  <fieldset class="form-fieldset">
    <legend class="form-legend">Book your free consultation</legend>

    <div class="grid--2">
      <div class="form-field">
        <label class="form-label" for="lf-first">First name</label>
        <input class="form-input" id="lf-first" name="First Name" type="text" autocomplete="given-name">
      </div>
      <div class="form-field">
        <label class="form-label" for="lf-last">Full name <abbr title="required">*</abbr></label>
        <input class="form-input" id="lf-last" name="Last Name" type="text" required autocomplete="family-name">
      </div>
    </div>

    <div class="grid--2">
      <div class="form-field">
        <label class="form-label" for="lf-email">Email <abbr title="required">*</abbr></label>
        <input class="form-input" id="lf-email" name="Email" type="email" required autocomplete="email">
      </div>
      <div class="form-field">
        <label class="form-label" for="lf-phone">Phone / WhatsApp <abbr title="required">*</abbr></label>
        <input class="form-input" id="lf-phone" name="Phone" type="tel" required autocomplete="tel" placeholder="+91">
        <p class="form-hint">We reply on WhatsApp during office hours.</p>
      </div>
    </div>

    <div class="form-field">
      <label class="form-label" for="lf-message">What would you like help with? <span class="form-label__optional">(optional)</span></label>
      <textarea class="form-input" id="lf-message" name="Description" rows="4"
                placeholder="Destination, study level, intake, and anything you're unsure about"></textarea>
    </div>

    <label class="form-choice">
      <input type="checkbox" name="LEADCF_CONSENT" value="Yes" required>
      <span>I agree to RichenQuest contacting me about my inquiry, and I have read the
        <a href="/legal/privacy/">privacy policy</a>. <abbr title="required">*</abbr></span>
    </label>

    <div class="form-actions">
      <button class="btn btn--primary" type="submit">Book free consultation</button>
    </div>
    <p class="form-hint">Prefer to talk now? <a href="{{ site.whatsapp_href }}">Message us on WhatsApp</a>.</p>
  </fieldset>
</form>
