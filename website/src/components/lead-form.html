<!-- component: lead-form — Zoho CRM Web-to-Lead form.
     ADR-003 compliant: the browser POSTs DIRECTLY to Zoho. No backend, no
     submission handler, no website database. Zoho owns dedupe, assignment
     (Student_Lead_Routing) and every downstream workflow.

     UPDATED 2026-08-15: the webform now carries Description, Lead Source Detail,
     UTM Source/Medium/Campaign and WhatsApp Number — added via browser automation
     and verified by probe. LEADCF indices in data/webform-fields.json were
     established empirically (one probe POST per index, COQL read-back).

     THIS FORM CONTAINS ONLY FIELDS THE WEBFORM ACTUALLY ACCEPTS.
     Verified by live probe 2026-08-13 (File 15): Zoho returns HTTP 200 and
     SILENTLY DISCARDS any field absent from the webform configuration. A message
     textarea or hidden UTM inputs would look like they worked and store nothing —
     the exact defect File 12 records on the legacy site. Accepted fields today:
     Company, Last Name, Email, Phone, LEADCF1 (Lead Type).

     Company is mandatory in the webform (mndFileds = ['Company','Last Name'])
     and students have no company, so it is sent as a fixed hidden value rather
     than asked.

     Lead Type is limited to Student/Parent. Zoho's picklist carries seven further
     B2B options; those belong on the future collaboration form, not a student
     consultation. One of them is also blocked by claims-guard under File 08 while
     no signed institutional agreements exist — which is why the option list here
     is an explicit allowlist rather than a copy of the picklist. -->
<form class="form" method="POST" accept-charset="UTF-8"
      action="{{ site.zoho_webform_action }}" data-lead-form>
  <input type="hidden" name="xnQsjsdp" value="{{ site.zoho_webform_key }}">
  <input type="hidden" name="xmIwtLD" value="{{ site.zoho_webform_digest }}">
  <input type="hidden" name="actionType" value="TGVhZHM=">
  <input type="hidden" name="returnURL" value="{{ site.zoho_webform_return_url }}">
  <!-- Satisfies the webform's mandatory Company field without asking a student
       for an employer they do not have. -->
  <input type="hidden" name="Company" value="Individual">
  <!-- Source + campaign attribution. LEADCF indices verified empirically
       2026-08-15 (see data/webform-fields.json); main.js fills UTM from the
       query string.
       Lead Source Detail is a PICKLIST — its only valid web value is
       "Website Form". Per-page values (e.g. "Italy Guide") would be rejected or
       would pollute the picklist, so page-level attribution needs either new
       picklist options or a text field. Not invented here. -->
  <input type="hidden" name="LEADCF3" value="Website Form">
  <!-- Consent. LEADCF13 = Consent_Policy_Version (verified by probe). The
       consent checkbox below is a hard client-side gate, so a lead reaching
       CRM from this form necessarily consented; Created_Time records WHEN and
       this field records WHICH policy. Consent_Given / Consent_Timestamp are
       on the webform but their LEADCF indices could not be resolved by probing
       (boolean/datetime reject probe values) — see docs/16 §8. -->
  <input type="hidden" name="LEADCF13" value="19 July 2026">
  <input type="hidden" name="LEADCF10" value="" data-utm="utm_source">
  <input type="hidden" name="LEADCF11" value="" data-utm="utm_medium">
  <input type="hidden" name="LEADCF12" value="" data-utm="utm_campaign">
  <!-- Zoho's spam honeypot. Must ship empty and stay hidden. -->
  <input type="text" name="aG9uZXlwb3Q" value="" tabindex="-1" autocomplete="off" hidden>

  <fieldset class="form-fieldset">
    <legend class="form-legend">Book your free consultation</legend>

    <div class="form-field">
      <label class="form-label" for="lf-name">Full name <abbr title="required">*</abbr></label>
      <input class="form-input" id="lf-name" name="Last Name" type="text" required
             autocomplete="name" maxlength="80">
    </div>

    <div class="grid--2">
      <div class="form-field">
        <label class="form-label" for="lf-email">Email <abbr title="required">*</abbr></label>
        <input class="form-input" id="lf-email" name="Email" type="email" required
               autocomplete="email" maxlength="100">
      </div>
      <div class="form-field">
        <label class="form-label" for="lf-phone">Phone / WhatsApp <abbr title="required">*</abbr></label>
        <input class="form-input" id="lf-phone" name="Phone" type="tel" required
               autocomplete="tel" maxlength="30" placeholder="+91">
      </div>
    </div>

    <div class="grid--2">
      <div class="form-field">
        <label class="form-label" for="lf-type">I am a <abbr title="required">*</abbr></label>
        <select class="form-input" id="lf-type" name="LEADCF1" required>
          <option value="Student" selected>Student</option>
          <option value="Parent">Parent</option>
        </select>
      </div>
      <div class="form-field">
        <label class="form-label" for="lf-whatsapp">WhatsApp
          <span class="form-label__optional">(if different)</span></label>
        <input class="form-input" id="lf-whatsapp" name="LEADCF9" type="tel"
               autocomplete="tel" maxlength="30" placeholder="+91">
      </div>
    </div>

    <div class="form-field">
      <label class="form-label" for="lf-message">What would you like help with?
        <span class="form-label__optional">(optional)</span></label>
      <textarea class="form-input" id="lf-message" name="Description" rows="4"
                placeholder="Destination, study level, intake, budget — and anything you're unsure about"></textarea>
    </div>

    <label class="form-choice">
      <input type="checkbox" id="lf-consent" required>
      <span>I agree to RichenQuest contacting me about my inquiry, and I have read the
        <a href="/legal/privacy/">privacy policy</a>. <abbr title="required">*</abbr></span>
    </label>

    <div class="form-actions">
      <button class="btn btn--primary" type="submit">Book free consultation</button>
    </div>

    <p class="form-hint">
      Prefer to talk now? <a href="{{ site.whatsapp_href }}">Message us on WhatsApp</a>.
    </p>
  </fieldset>
</form>
