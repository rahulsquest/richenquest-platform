<!-- component: head — document <head> shared by every layout.
     expects: page.title, page.description, page.url (set by build), site.*, build.hash -->
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>{{ page.title }}</title>
<meta name="description" content="{{ page.description }}">
<link rel="canonical" href="{{ site.url }}{{ page.url }}">
<meta property="og:site_name" content="{{ site.name }}">
<meta property="og:title" content="{{ page.title }}">
<meta property="og:description" content="{{ page.description }}">
<meta property="og:type" content="website">
<meta property="og:url" content="{{ site.url }}{{ page.url }}">
<meta property="og:image" content="{{ site.url }}/assets/img/og-cover.jpg">
<meta property="og:image:width" content="1200">
<meta property="og:image:height" content="630">
<meta name="twitter:card" content="summary_large_image">
<meta name="theme-color" content="#16233a">
<link rel="stylesheet" href="/assets/css/site.css?v={{ build.hash }}">
<script type="application/ld+json">
{
  "@context": "https://schema.org",
  "@type": "EducationalOrganization",
  "name": "{{ site.name }}",
  "legalName": "{{ site.legal_name }}",
  "slogan": "{{ site.tagline }}",
  "url": "{{ site.url }}",
  "email": "{{ site.email }}",
  "telephone": ["{{ site.phone_in }}", "{{ site.phone_it }}"],
  "foundingDate": "2026-01",
  "areaServed": ["IN", "NP"],
  "address": { "@type": "PostalAddress", "addressLocality": "Patna", "addressRegion": "Bihar", "addressCountry": "IN" }
}
</script>
