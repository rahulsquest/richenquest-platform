name: CI

on:
  pull_request:
  push:
    branches: [main]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Build site
        run: node website/build.mjs

      - name: Claims guard (Verified Claims Library — docs/08, ADR-005)
        run: node scripts/claims-guard.mjs

      # M1 additions (tracked in File 09 §13): HTML validation, internal link check,
      # Lighthouse CI with the File 10 §9 performance budgets.
