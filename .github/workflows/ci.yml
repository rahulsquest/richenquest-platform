name: CI

on:
  pull_request:
  push:
    branches: [main]

jobs:
  build-and-verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version-file: ".nvmrc"

      - name: Build site
        run: node website/build.mjs

      - name: Claims guard (Verified Claims Library — docs/08, ADR-005)
        run: node scripts/claims-guard.mjs

      - name: Internal link & asset check
        run: node scripts/check-links.mjs

      # CI-only analyzers (File 11 decision C5): pinned versions, never shipped.
      # Rule config lives in .htmlvalidate.json — two typographic rules are relaxed
      # there so they cannot push presentation concerns into src/data (File 10 §3).
      - name: HTML validation
        run: npx --yes html-validate@8.24.1 "website/dist/**/*.html"

      - name: Lighthouse CI (budgets in lighthouserc.json)
        run: npx --yes @lhci/cli@0.14.0 autorun
