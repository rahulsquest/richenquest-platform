# Deploys website/dist to the Zoho Catalyst DEVELOPMENT environment.
# Activates automatically once the CATALYST_TOKEN secret exists (founder
# creates the Catalyst project first — File 13 action 3). Until then the
# deploy step reports and exits green so CI history stays clean.
name: Deploy (Development)

on:
  workflow_dispatch:
  push:
    branches: [main]

concurrency:
  group: deploy-dev
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  deploy-dev:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version-file: ".nvmrc"

      - name: Build site
        run: node website/build.mjs

      - name: Claims guard
        run: node scripts/claims-guard.mjs

      - name: Internal link & asset check
        run: node scripts/check-links.mjs

      - name: Deploy to Catalyst (Development)
        env:
          CATALYST_TOKEN: ${{ secrets.CATALYST_TOKEN }}
          CATALYST_ORG: ${{ secrets.CATALYST_ORG }}
        run: |
          if [ -z "$CATALYST_TOKEN" ]; then
            echo "::warning::CATALYST_TOKEN not set — Catalyst project pending (File 13, founder action 3). Skipping deploy."
            exit 0
          fi
          npm install -g zcatalyst-cli@1.27.0
          # UNVERIFIED: this invocation has never run against a real Catalyst
          # project. --project/--env/--token are inferred from File 09 §5, not
          # confirmed. Expect to correct them on the first deploy.
          # AFTER the first successful deploy, replace the three lines above with:
          #   # Verified against zcatalyst-cli <version> on <YYYY-MM-DD>
          catalyst deploy --project richenquest --env development --token "$CATALYST_TOKEN"
