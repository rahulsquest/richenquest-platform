# PRODUCTION deploy — release tags only, behind a manual approval environment.
# Setup (one-time, on GitHub): Settings → Environments → "production" →
# require reviewers (founder). Rollback = re-run this workflow from the
# previous release tag.
name: Deploy (Production)

on:
  push:
    tags: ["v*"]

concurrency:
  group: deploy-prod
  cancel-in-progress: false

jobs:
  deploy-prod:
    runs-on: ubuntu-latest
    environment: production
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version-file: ".nvmrc"

      - name: Build site
        run: node website/build.mjs

      - name: Claims guard
        run: node scripts/claims-guard.mjs

      - name: Internal link & asset check
        run: node scripts/check-links.mjs

      - name: Deploy to Catalyst (Production)
        env:
          CATALYST_TOKEN: ${{ secrets.CATALYST_TOKEN }}
          CATALYST_ORG: ${{ secrets.CATALYST_ORG }}
        run: |
          if [ -z "$CATALYST_TOKEN" ]; then
            echo "::error::CATALYST_TOKEN not set — cannot deploy to production."
            exit 1
          fi
          npm install -g zcatalyst-cli
          # Exact flags finalized during the M4 Catalyst spike (File 09 §5):
          catalyst deploy --project richenquest --env production --token "$CATALYST_TOKEN"
