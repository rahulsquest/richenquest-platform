# PRODUCTION deploy — release tags only, behind a manual approval environment.
# Setup (one-time, on GitHub): Settings → Environments → "production" →
# require reviewers (founder). Rollback = re-run this workflow from the
# previous release tag.
name: Deploy (Production)

on:
  push:
    tags: ["v*"]
  # Rollback path: re-deploy a previous release tag without cutting a new one.
  # Rehearse this once BEFORE launch — an incident is a bad time to learn it.
  workflow_dispatch:
    inputs:
      ref:
        description: "Release tag to deploy (e.g. v1.0.0). Defaults to the branch/tag this run was started from."
        required: false
        type: string

concurrency:
  group: deploy-prod
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  deploy-prod:
    runs-on: ubuntu-latest
    environment: production
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.ref || github.ref }}

      - uses: actions/setup-node@v4
        with:
          node-version-file: ".nvmrc"

      - name: Build site
        run: node website/build.mjs

      - name: Claims guard
        run: node scripts/claims-guard.mjs

      - name: Internal link & asset check
        run: node scripts/check-links.mjs

      - name: Deploy to Catalyst (Production)
        env:
          CATALYST_TOKEN: ${{ secrets.CATALYST_TOKEN }}
          CATALYST_ORG: ${{ secrets.CATALYST_ORG }}
          CATALYST_PROJECT_ID: "53691000000016002"
        run: |
          if [ -z "$CATALYST_TOKEN" ]; then
            echo "::error::CATALYST_TOKEN not set — cannot deploy to production."
            exit 1
          fi
          # HALTED — verified against zcatalyst-cli 1.27.0 on 2026-08-13.
          #
          # zcatalyst-cli has NO production deploy path:
          #   - `catalyst deploy` always targets the DEVELOPMENT environment
          #     (per its own --help), and there is no --env flag. The previous
          #     `--env production` failed at parse:
          #       error: unknown option '--env'
          #   - there is no promote/publish command in the 1.27.0 command list.
          #
          # Removing --env would make this job deploy to DEVELOPMENT while
          # calling itself a production release — a silent, dangerous failure.
          # So it fails loudly instead, until the promotion mechanism is
          # established and recorded (founder decision, Phase 3).
          echo "::error::No production deploy path in zcatalyst-cli 1.27.0."
          echo "::error::'catalyst deploy' targets Development only; there is no --env or promote command."
          echo "::error::Resolve the Catalyst production promotion mechanism before tagging a release."
          echo "::error::Verified 2026-08-13. See infra/ and the execution ledger."
          exit 1
